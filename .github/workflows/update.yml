          if has_changes:
              print(f"\n=== OMAPIv2分支更新完成 ===")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('OMAPI_HAS_CHANGES=true\n')
          else:
              print(f"\n=== OMAPIv2分支没有更新 ===")
          PY

      - name: Commit & Push OMAPIv2 branch if changed
        if: env.OMAPI_HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add KdkSupportPkg/manifest.json MetallibSupportPkg/manifest.json
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore(OMAPIv2): 更新KDK和MetalLib manifests [skip ci]"
          git push origin OMAPIv2
          echo "OMAPIv2分支更新已推送"
