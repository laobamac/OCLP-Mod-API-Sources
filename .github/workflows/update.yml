name: Update KDK & Metallib Manifest Mirror

on:
  schedule:
    - cron: '*/60 * * * *'
  workflow_dispatch:
  push:  # 添加push触发
    branches:
      - main
      - OMAPIv2
    paths:
      - 'KdkSupportPkg/**'  # 如果脚本有更新时触发
      - 'MetallibSupportPkg/**'  # 如果脚本有更新时触发
      - '.github/workflows/**'  # 工作流文件更新时触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录，方便比较
          ref: ${{ github.ref }}  # 使用当前分支

      - name: Update manifests
        run: |
          python - <<'PY'
          import json
          import ssl
          from urllib.request import urlopen
          from pathlib import Path
          import os
          
          # 全局禁用 SSL 验证
          ssl._create_default_https_context = ssl._create_unverified_context
          
          # 获取当前分支名称
          CURRENT_BRANCH = os.environ.get('GITHUB_REF_NAME', 'main')
          print(f"当前分支: {CURRENT_BRANCH}")
          print(f"工作目录: {os.getcwd()}")
          
          # 两个分支使用相同的manifest配置
          MANIFESTS = [
              {
                  "name": "KdkSupportPkg",
                  "src": "https://dortania.github.io/KdkSupportPkg/manifest.json",
                  "dir": "KdkSupportPkg",
                  "dest": "KdkSupportPkg/manifest.json"
              },
              {
                  "name": "MetallibSupportPkg",
                  "src": "https://dortania.github.io/MetallibSupportPkg/manifest.json",
                  "dir": "MetallibSupportPkg",
                  "dest": "MetallibSupportPkg/manifest.json"
              }
          ]
          
          def replace_github_url(url):
              """将 https://github.com/dortania 替换为 https://gitapi.simplehac.top/https://github.com/dortania"""
              old_prefix = "https://github.com/dortania/"
              new_prefix = "https://gitapi.simplehac.top/https://github.com/dortania/"
              
              if url.startswith(old_prefix):
                  return new_prefix + url[len(old_prefix):]
              return url
          
          def get_entry_filename(entry):
              """从条目中提取文件名"""
              url = entry.get("url", "")
              if url:
                  return url.split("/")[-1]
              return ""
          
          def get_entry_date(entry):
              """从条目中提取日期，用于排序"""
              # 优先使用date字段
              if "date" in entry:
                  return entry["date"]
              # 如果没有date字段，尝试从build或version中推断
              if "build" in entry:
                  return entry["build"]
              if "version" in entry:
                  return entry["version"]
              # 最后使用文件名
              filename = get_entry_filename(entry)
              return filename
          
          def sort_manifest_entries(entries):
              """按日期倒序排列条目（最新的在前面）"""
              try:
                  return sorted(
                      entries, 
                      key=lambda x: get_entry_date(x), 
                      reverse=True
                  )
              except Exception as e:
                  print(f"排序失败，使用原始顺序: {e}")
                  return entries
          
          has_changes = False
          changed_manifests = []
          
          for cfg in MANIFESTS:
              print(f"\n=== 处理 {cfg['name']} (分支: {CURRENT_BRANCH}) ===")
              print(f"源地址: {cfg['src']}")
              print(f"目标文件: {cfg['dest']}")
              
              # 检查目标目录是否存在
              dest_dir = Path(cfg["dir"])
              print(f"目标目录: {dest_dir.absolute()}")
              print(f"目录是否存在: {dest_dir.exists()}")
              
              # 读取本地现有的manifest
              local_path = Path(cfg["dest"])
              local_data = []
              if local_path.exists():
                  try:
                      with open(local_path, "r", encoding="utf-8") as f:
                          local_data = json.load(f)
                      print(f"本地manifest包含 {len(local_data)} 个条目")
                  except Exception as e:
                      print(f"读取本地manifest失败: {e}")
                      local_data = []
              else:
                  print("本地manifest不存在，将创建新文件")
              
              # 下载最新的manifest
              try:
                  with urlopen(cfg["src"], timeout=30) as response:
                      remote_data = json.load(response)
                  print(f"远程manifest包含 {len(remote_data)} 个条目")
              except Exception as e:
                  print(f"下载远程manifest失败: {e}")
                  continue
              
              if not remote_data:
                  print("远程manifest没有数据")
                  continue
              
              # 创建现有条目的文件名集合
              existing_filenames = set()
              for entry in local_data:
                  filename = get_entry_filename(entry)
                  if filename:
                      existing_filenames.add(filename)
              
              print(f"已存在的文件: {len(existing_filenames)} 个")
              
              # 准备新的数据列表
              new_entries = []  # 新添加的条目
              new_filenames = []  # 新添加的文件名
              
              # 处理所有远程条目
              for remote_entry in remote_data:
                  remote_filename = get_entry_filename(remote_entry)
                  
                  if not remote_filename:
                      continue
                  
                  # 检查是否已存在
                  if remote_filename in existing_filenames:
                      continue
                  
                  # 这是一个新条目
                  new_entry = remote_entry.copy()
                  # 替换GitHub URL前缀
                  if "url" in new_entry:
                      new_entry["url"] = replace_github_url(new_entry["url"])
                  
                  new_entries.append(new_entry)
                  new_filenames.append(remote_filename)
                  print(f"  发现新条目: {remote_filename}")
              
              # 如果没有新条目，直接跳过
              if not new_entries:
                  print(f"{cfg['name']} 没有发现新条目")
                  continue
              
              # 对新条目按时间倒序排序（最新的在前面）
              sorted_new_entries = sort_manifest_entries(new_entries)
              print(f"发现 {len(new_entries)} 个新条目")
              
              # 合并数据：新条目在前，现有条目在后
              merged_data = []
              
              # 1. 先添加新条目（已排序）
              merged_data.extend(sorted_new_entries)
              
              # 2. 再添加所有现有条目（保持原顺序）
              for local_entry in local_data:
                  merged_data.append(local_entry)
              
              print(f"合并后总条目数: {len(merged_data)}")
              print(f"预期总条目数: {len(local_data)} + {len(new_entries)} = {len(local_data) + len(new_entries)}")
              
              # 检查总数是否正确
              if len(merged_data) != len(local_data) + len(new_entries):
                  print(f"警告: 条目数量不匹配")
              
              # 确保目录存在
              dest_dir.mkdir(exist_ok=True, parents=True)
              
              # 保存新的manifest
              with open(local_path, "w", encoding="utf-8") as f:
                  json.dump(merged_data, f, indent=2, ensure_ascii=False, separators=(',', ': '))
                  f.write("\n")
              print(f"已保存更新后的manifest → {local_path}")
              
              has_changes = True
              changed_manifests.append(cfg["name"])
          
          if has_changes:
              print(f"\n=== {CURRENT_BRANCH} 分支更新总结 ===")
              print(f"更新的manifests: {', '.join(changed_manifests)}")
              # 设置环境变量供后续步骤使用
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('HAS_CHANGES=true\n')
                  f.write(f'CHANGED_MANIFESTS={",".join(changed_manifests)}\n')
          else:
              print(f"\n=== {CURRENT_BRANCH} 分支更新总结 ===")
              print("所有manifest均无更新")
          PY
      
      - name: Check if commit is needed
        id: check-changes
        run: |
          # 获取当前分支
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "当前分支: $CURRENT_BRANCH"
          
          # 检查的manifest文件列表（两个分支使用相同的目录结构）
          MANIFEST_FILES="KdkSupportPkg/manifest.json MetallibSupportPkg/manifest.json"
          
          echo "检查的文件: $MANIFEST_FILES"
          
          # 列出文件状态
          echo "=== 文件状态 ==="
          git status --porcelain $MANIFEST_FILES 2>/dev/null || true
          
          # 检查是否有文件被修改
          CHANGED_COUNT=$(git status --porcelain $MANIFEST_FILES 2>/dev/null | wc -l)
          echo "变更文件数量: $CHANGED_COUNT"
          
          if [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "manifest文件没有变更"
            echo "should_commit=false" >> $GITHUB_OUTPUT
          else
            echo "发现 $CHANGED_COUNT 个manifest文件有变更"
            echo "should_commit=true" >> $GITHUB_OUTPUT
            
            # 显示具体的变更详情
            echo ""
            echo "=== 变更详情 ==="
            for file in $MANIFEST_FILES; do
              if [ -f "$file" ]; then
                echo "--- $file ---"
                if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                  # 文件已在git中，显示差异统计
                  ADDED=$(git diff "$file" | grep '^+' | grep -v '^+++' | wc -l)
                  REMOVED=$(git diff "$file" | grep '^-' | grep -v '^---' | wc -l)
                  echo "  新增行数: $ADDED, 删除行数: $REMOVED"
                else
                  # 新文件
                  LINE_COUNT=$(wc -l < "$file")
                  echo "  新文件，共 $LINE_COUNT 行"
                fi
              fi
            done
          fi
      
      - name: Commit & Push if changed
        if: steps.check-changes.outputs.should_commit == 'true'
        run: |
          # 获取当前分支
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "当前分支: $CURRENT_BRANCH"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加manifest文件
          echo "=== 添加文件到暂存区 ==="
          git add KdkSupportPkg/manifest.json || echo "KdkSupportPkg/manifest.json 添加失败"
          git add MetallibSupportPkg/manifest.json || echo "MetallibSupportPkg/manifest.json 添加失败"
          
          # 检查暂存区的文件
          echo "=== 暂存区状态 ==="
          git status --porcelain || true
          
          # 检查是否有文件在暂存区
          STAGED_COUNT=$(git diff --cached --name-only | wc -l)
          echo "暂存区文件数量: $STAGED_COUNT"
          
          if [ "$STAGED_COUNT" -eq 0 ]; then
            echo "没有文件需要提交"
            exit 0
          fi
          
          # 统计新增条目数量（简化版）
          echo "=== 分析变更 ==="
          NEW_ENTRIES_INFO=""
          
          # 检查KdkSupportPkg
          if git diff --cached --quiet KdkSupportPkg/manifest.json 2>/dev/null; then
            echo "KdkSupportPkg/manifest.json 没有变更"
          else
            ADDED_LINES=$(git diff --cached KdkSupportPkg/manifest.json | grep '^+' | grep -v '^+++' | wc -l)
            echo "KdkSupportPkg 新增行数: $ADDED_LINES"
            if [ "$ADDED_LINES" -gt 3 ]; then
              NEW_ENTRIES_INFO="${NEW_ENTRIES_INFO} KDK"
            fi
          fi
          
          # 检查MetallibSupportPkg
          if git diff --cached --quiet MetallibSupportPkg/manifest.json 2>/dev/null; then
            echo "MetallibSupportPkg/manifest.json 没有变更"
          else
            ADDED_LINES=$(git diff --cached MetallibSupportPkg/manifest.json | grep '^+' | grep -v '^+++' | wc -l)
            echo "MetallibSupportPkg 新增行数: $ADDED_LINES"
            if [ "$ADDED_LINES" -gt 3 ]; then
              NEW_ENTRIES_INFO="${NEW_ENTRIES_INFO} MetalLib"
            fi
          fi
          
          # 生成提交信息
          if [ -n "$NEW_ENTRIES_INFO" ]; then
            COMMIT_MSG="chore($CURRENT_BRANCH): 新增${NEW_ENTRIES_INFO}条目 [skip ci]"
          else
            COMMIT_MSG="chore($CURRENT_BRANCH): 更新manifest文件 [skip ci]"
          fi
          
          # 清理提交信息中的多余空格
          COMMIT_MSG=$(echo "$COMMIT_MSG" | sed 's/  / /g')
          
          echo "提交信息: $COMMIT_MSG"
          
          # 提交并推送
          git commit -m "$COMMIT_MSG"
          
          echo "=== 推送变更 ==="
          git push origin "HEAD:$CURRENT_BRANCH"
          echo "已推送到 $CURRENT_BRANCH 分支!"
      
      - name: Skip commit message
        if: steps.check-changes.outputs.should_commit == 'false'
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "$CURRENT_BRANCH 分支没有变更需要提交"