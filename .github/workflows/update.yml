name: Update KDK & Metallib Manifest Mirror

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:  # 添加push触发
    branches:
      - main
      - master
    paths:
      - 'KdkSupportPkg/**'  # 如果脚本有更新时触发
      - 'MetallibSupportPkg/**'  # 如果脚本有更新时触发
      - '.github/workflows/**'  # 工作流文件更新时触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史记录，方便比较

      - name: Update manifests (add missing entries only)
        run: |
          python - <<'PY'
          import json
          import ssl
          from urllib.request import urlopen
          from pathlib import Path
          import os
          
          # 全局禁用 SSL 验证
          ssl._create_default_https_context = ssl._create_unverified_context
          
          MANIFESTS = [
              {
                  "name": "KdkSupportPkg",
                  "src": "https://dortania.github.io/KdkSupportPkg/manifest.json",
                  "dir": "KdkSupportPkg",
                  "dest": "KdkSupportPkg/manifest.json"
              },
              {
                  "name": "MetallibSupportPkg",
                  "src": "https://dortania.github.io/MetallibSupportPkg/manifest.json",
                  "dir": "MetallibSupportPkg",
                  "dest": "MetallibSupportPkg/manifest.json"
              }
          ]
          
          def replace_github_url(url):
              """将 https://github.com/dortania 替换为 https://gitapi.simplehac.top/https://github.com/dortania"""
              old_prefix = "https://github.com/dortania/"
              new_prefix = "https://gitapi.simplehac.top/https://github.com/dortania/"
              
              if url.startswith(old_prefix):
                  return new_prefix + url[len(old_prefix):]
              return url
          
          def get_entry_filename(entry):
              """从条目中提取文件名"""
              url = entry.get("url", "")
              if url:
                  return url.split("/")[-1]
              return ""
          
          def get_entry_date(entry):
              """从条目中提取日期，用于排序"""
              # 优先使用date字段
              if "date" in entry:
                  return entry["date"]
              # 如果没有date字段，尝试从build或version中推断
              if "build" in entry:
                  return entry["build"]
              if "version" in entry:
                  return entry["version"]
              # 最后使用文件名
              filename = get_entry_filename(entry)
              return filename
          
          def sort_manifest_entries(entries):
              """按日期倒序排列条目（最新的在前面）"""
              return sorted(
                  entries, 
                  key=lambda x: get_entry_date(x), 
                  reverse=True
              )
          
          has_changes = False
          
          for cfg in MANIFESTS:
              print(f"\n=== Processing {cfg['name']} ===")
              
              # 读取本地现有的manifest
              local_path = Path(cfg["dest"])
              local_data = []
              if local_path.exists():
                  try:
                      with open(local_path, "r", encoding="utf-8") as f:
                          local_data = json.load(f)
                      print(f"Local manifest exists with {len(local_data)} entries")
                  except Exception as e:
                      print(f"Failed to read local manifest: {e}")
                      local_data = []
              
              # 下载最新的manifest
              try:
                  with urlopen(cfg["src"], timeout=25) as response:
                      remote_data = json.load(response)
                  print(f"Remote manifest has {len(remote_data)} entries")
              except Exception as e:
                  print(f"Failed to download remote manifest: {e}")
                  continue
              
              if not remote_data:
                  print("No data in remote manifest")
                  continue
              
              # 创建现有条目的文件名集合和映射
              existing_filenames = set()
              local_entry_map = {}  # 文件名 -> 条目
              for entry in local_data:
                  filename = get_entry_filename(entry)
                  if filename:
                      existing_filenames.add(filename)
                      local_entry_map[filename] = entry
              
              print(f"Existing files: {len(existing_filenames)}")
              
              # 准备新的数据列表
              new_entries = []  # 新添加的条目
              new_filenames = []  # 新添加的文件名
              
              # 首先处理所有远程条目，按时间顺序
              for remote_entry in remote_data:
                  remote_filename = get_entry_filename(remote_entry)
                  
                  if not remote_filename:
                      print(f"Warning: Remote entry has no filename: {remote_entry}")
                      continue
                  
                  # 检查是否已存在
                  if remote_filename in existing_filenames:
                      # 已存在，跳过
                      continue
                  
                  # 这是一个新条目
                  new_entry = remote_entry.copy()
                  # 替换GitHub URL前缀
                  if "url" in new_entry:
                      new_entry["url"] = replace_github_url(new_entry["url"])
                  
                  new_entries.append(new_entry)
                  new_filenames.append(remote_filename)
                  print(f"  Added new entry: {remote_filename}")
              
              # 如果没有新条目，直接跳过
              if not new_entries:
                  print(f"No new entries found for {cfg['name']}")
                  continue
              
              # 对新条目按时间倒序排序（最新的在前面）
              sorted_new_entries = sort_manifest_entries(new_entries)
              print(f"Found {len(new_entries)} new entries")
              print(f"New files: {', '.join(new_filenames)}")
              
              # 合并数据：新条目在前，现有条目在后
              merged_data = []
              
              # 1. 先添加新条目（已排序）
              merged_data.extend(sorted_new_entries)
              
              # 2. 再添加所有现有条目（保持原顺序）
              # 注意：我们只添加本地中不存在于新条目中的条目
              # 避免重复（理论上不应该有重复）
              for local_entry in local_data:
                  local_filename = get_entry_filename(local_entry)
                  if local_filename not in new_filenames:  # 确保不重复
                      merged_data.append(local_entry)
              
              print(f"Total entries after merge: {len(merged_data)}")
              
              # 检查总数是否正确
              expected_total = len(local_data) + len(new_entries)
              if len(merged_data) != expected_total:
                  print(f"Warning: Entry count mismatch. Expected {expected_total}, got {len(merged_data)}")
                  print("This might indicate duplicate entries.")
              
              # 确保目录存在
              Path(cfg["dir"]).mkdir(exist_ok=True)
              
              # 保存新的manifest
              with open(local_path, "w", encoding="utf-8") as f:
                  json.dump(merged_data, f, indent=2, ensure_ascii=False, separators=(',', ': '))
                  f.write("\n")
              print(f"Updated manifest saved → {local_path}")
              
              has_changes = True
          
          if has_changes:
              print("\n=== Summary ===")
              print("Manifests have been updated with new entries")
              # 设置环境变量供后续步骤使用
              import sys
              sys.stdout.flush()
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('HAS_CHANGES=true\n')
          else:
              print("\n=== Summary ===")
              print("No changes in any manifest")
          PY
      
      - name: Check if commit is needed
        id: check-changes
        run: |
          # 首先检查是否有文件被修改
          if [ -z "$(git status --porcelain KdkSupportPkg/manifest.json MetallibSupportPkg/manifest.json 2>/dev/null)" ]; then
            echo "No changes detected in manifest files"
            echo "should_commit=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in manifest files"
            echo "should_commit=true" >> $GITHUB_OUTPUT
            
            # 显示具体的变更
            echo "=== Changes summary ==="
            git status --porcelain
            echo ""
            echo "=== File changes ==="
            for file in KdkSupportPkg/manifest.json MetallibSupportPkg/manifest.json; do
              if [ -f "$file" ]; then
                echo "--- $file ---"
                # 检查文件是否在git中
                if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                  # 文件已在git中，显示差异
                  git diff --stat "$file"
                else
                  # 新文件，显示内容预览
                  echo "New file with $(wc -l < "$file") lines"
                fi
              fi
            done
          fi
      
      - name: Commit & Push if changed
        if: steps.check-changes.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加所有变更的manifest文件
          for dir in KdkSupportPkg MetallibSupportPkg; do
            if [ -f "$dir/manifest.json" ]; then
              git add "$dir/manifest.json"
              echo "Added $dir/manifest.json to staging"
            fi
          done
          
          # 获取变更的文件列表用于提交信息
          changed_files=$(git diff --name-only --cached)
          echo "Changed files: $changed_files"
          
          # 统计新增条目数量
          new_entries_info=""
          for dir in KdkSupportPkg MetallibSupportPkg; do
            if [ -f "$dir/manifest.json" ]; then
              # 如果是第一次提交或者文件是新的，跳过统计
              if git ls-files --error-unmatch "$dir/manifest.json" >/dev/null 2>&1; then
                # 计算新旧行数差异
                old_lines=$(git diff --unified=0 HEAD "$dir/manifest.json" | grep '^+' | wc -l || echo "0")
                if [ "$old_lines" -gt 10 ]; then
                  new_entries_info="${new_entries_info} $dir"
                fi
              fi
            fi
          done
          
          # 生成提交信息
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [ -n "$new_entries_info" ]; then
              commit_msg="chore: add new entries to${new_entries_info} manifests after push [skip ci]"
            else
              commit_msg="chore: update manifests after push [skip ci]"
            fi
          else
            if [ -n "$new_entries_info" ]; then
              commit_msg="chore: add new entries to${new_entries_info} manifests [skip ci]"
            else
              commit_msg="chore: update manifests [skip ci]"
            fi
          fi
          
          git commit -m "$commit_msg"
          git push
          echo "Updated and pushed!"
      
      - name: Skip commit message
        if: steps.check-changes.outputs.should_commit == 'false'
        run: |
          echo "No changes to commit, skipping push"
