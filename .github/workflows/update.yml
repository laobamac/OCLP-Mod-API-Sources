name: Update KDK & Metallib Manifest Mirror

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:  # 添加push触发
    branches:
      - main
      - OMAPIv2
    paths:
      - 'KdkSupportPkg/**'  # 如果脚本有更新时触发
      - 'MetallibSupportPkg/**'  # 如果脚本有更新时触发
      - '.github/workflows/**'  # 工作流文件更新时触发

jobs:
  update-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main  # 显式检出main分支
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifests for main branch
        run: |
          python - <<'PY'
          import json
          import ssl
          from urllib.request import urlopen
          from pathlib import Path
          import os
          
          ssl._create_default_https_context = ssl._create_unverified_context
          
          MANIFESTS = [
              {
                  "name": "KdkSupportPkg",
                  "src": "https://dortania.github.io/KdkSupportPkg/manifest.json",
                  "dest": "KdkSupportPkg/manifest.json"
              },
              {
                  "name": "MetallibSupportPkg",
                  "src": "https://dortania.github.io/MetallibSupportPkg/manifest.json",
                  "dest": "MetallibSupportPkg/manifest.json"
              }
          ]
          
          def replace_github_url(url):
              old_prefix = "https://github.com/dortania/"
              new_prefix = "https://proxy.yaoyaoling.net/https://github.com/dortania/"
              if url.startswith(old_prefix):
                  return new_prefix + url[len(old_prefix):]
              return url
          
          def get_entry_filename(entry):
              url = entry.get("url", "")
              return url.split("/")[-1] if url else ""
          
          def get_entry_date(entry):
              if "date" in entry:
                  return entry["date"]
              if "build" in entry:
                  return entry["build"]
              if "version" in entry:
                  return entry["version"]
              return get_entry_filename(entry)
          
          def sort_manifest_entries(entries):
              try:
                  return sorted(entries, key=lambda x: get_entry_date(x), reverse=True)
              except:
                  return entries
          
          has_changes = False
          
          for cfg in MANIFESTS:
              print(f"\n=== 处理 {cfg['name']} (main分支) ===")
              
              # 读取本地现有的manifest
              local_path = Path(cfg["dest"])
              local_data = []
              if local_path.exists():
                  try:
                      with open(local_path, "r", encoding="utf-8") as f:
                          local_data = json.load(f)
                      print(f"本地manifest包含 {len(local_data)} 个条目")
                  except Exception as e:
                      print(f"读取本地manifest失败: {e}")
                      local_data = []
              
              # 下载最新的manifest
              try:
                  with urlopen(cfg["src"], timeout=30) as response:
                      remote_data = json.load(response)
                  print(f"远程manifest包含 {len(remote_data)} 个条目")
              except Exception as e:
                  print(f"下载远程manifest失败: {e}")
                  continue
              
              if not remote_data:
                  continue
              
              # 创建现有条目的文件名集合
              existing_filenames = {get_entry_filename(entry) for entry in local_data if get_entry_filename(entry)}
              
              print(f"已存在的文件: {len(existing_filenames)} 个")
              
              # 查找新条目
              new_entries = []
              for remote_entry in remote_data:
                  remote_filename = get_entry_filename(remote_entry)
                  if not remote_filename or remote_filename in existing_filenames:
                      continue
                  
                  new_entry = remote_entry.copy()
                  if "url" in new_entry:
                      new_entry["url"] = replace_github_url(new_entry["url"])
                  
                  new_entries.append(new_entry)
                  print(f"  发现新条目: {remote_filename}")
              
              if not new_entries:
                  print(f"没有发现新条目")
                  continue
              
              # 合并数据：新条目在前，现有条目在后
              sorted_new_entries = sort_manifest_entries(new_entries)
              merged_data = sorted_new_entries + local_data
              
              print(f"发现 {len(new_entries)} 个新条目，合并后总条目数: {len(merged_data)}")
              
              # 确保目录存在
              local_path.parent.mkdir(exist_ok=True, parents=True)
              
              # 保存新的manifest
              with open(local_path, "w", encoding="utf-8") as f:
                  json.dump(merged_data, f, indent=2, ensure_ascii=False, separators=(',', ': '))
                  f.write("\n")
              print(f"已保存更新后的manifest")
              
              has_changes = True
          
          if has_changes:
              print(f"\n=== main分支更新完成 ===")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('MAIN_HAS_CHANGES=true\n')
          else:
              print(f"\n=== main分支没有更新 ===")
          PY

      - name: Commit & Push main branch if changed
        if: env.MAIN_HAS_CHANGES == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add KdkSupportPkg/manifest.json MetallibSupportPkg/manifest.json
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore(main): 更新KDK和MetalLib manifests [skip ci]"
          git push origin main
          echo "main分支更新已推送"

  update-omapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: update-main  # 等待main分支更新完成
    if: always()  # 即使main分支更新失败也继续
    
    steps:
      - name: Checkout OMAPIv2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: OMAPIv2  # 检出OMAPIv2分支
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifests for OMAPIv2 branch
