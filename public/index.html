<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件下载验证</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
        }
        .loading {
            color: #666;
        }
        .error {
            color: #d63031;
            background: #ffeaa7;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            color: #00b894;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文件下载</h1>
        <div id="status">
            <p class="loading">验证下载链接中...</p>
        </div>
    </div>

    <script>
        async function validateAndDownload() {
            const urlParams = new URLSearchParams(window.location.search);
            const origin = urlParams.get('origin');
            const sign = urlParams.get('sign');
            const t = urlParams.get('t');

            if (!origin || !sign || !t) {
                showError('缺少必要的参数：origin, sign, t');
                return;
            }

            try {
                // 直接使用当前路径，EdgeOne Pages 会路由到 Node.js 函数
                const response = await fetch(`/download?origin=${encodeURIComponent(origin)}&sign=${encodeURIComponent(sign)}&t=${encodeURIComponent(t)}`);
                
                if (response.redirected) {
                    // 如果重定向，说明验证成功，开始下载
                    showSuccess('验证成功，开始下载...');
                    window.location.href = response.url;
                } else if (response.ok) {
                    const result = await response.json();
                    if (result.downloadUrl) {
                        showSuccess('验证成功，开始下载...');
                        window.location.href = result.downloadUrl;
                    }
                } else {
                    const errorData = await response.json();
                    showError(`验证失败: ${errorData.error || '未知错误'}`);
                }
            } catch (error) {
                showError(`网络错误: ${error.message}`);
            }
        }

        function showError(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="error">${message}</div>`;
        }

        function showSuccess(message) {
            const statusEl = document.getElementById('status');
            statusEl.innerHTML = `<div class="success">${message}</div>`;
        }

        // 页面加载时自动验证
        document.addEventListener('DOMContentLoaded', validateAndDownload);
    </script>
</body>
</html>
